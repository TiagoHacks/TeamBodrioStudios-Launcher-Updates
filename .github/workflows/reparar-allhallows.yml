name: Reparar Allhallows con JSON invalido
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/reparar-allhallows.yml"
permissions:
  contents: write
concurrency:
  group: publicacion-murder-mystery
  cancel-in-progress: false
jobs:
  reparar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Seleccionar version valida o retirar mod roto
        run: python3 scripts/reparar_allhallows.py
      - name: Validar manifiesto y publicar
        shell: bash
        run: |
          python3 -m json.tool modos/manifest.json > /dev/null
          if git diff --quiet -- modos/manifest.json; then
            echo "Sin cambios."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modos/manifest.json
          git commit -m "Sustituir Allhallows con metadata JSON malformada"
          git push origin HEAD:main
